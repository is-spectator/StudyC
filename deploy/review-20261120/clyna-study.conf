# New host only. Do not replace an existing PlanPlan/clyna.ai server block.
server {
    listen 80;
    server_name study.clyna.ai;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/planplan-web-acme; }
    location / { return 308 https://study.clyna.ai$request_uri; }
}
server {
    listen 443 ssl;
    server_name study.clyna.ai;
    ssl_certificate /etc/letsencrypt/live/clyna-products/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clyna-products/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/clyna-study/current/web;
    index index.html;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store, private" always;

    location = /v1/auth/web/session {
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header X-PlanPlan-Expected-User $http_x_planplan_expected_user;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_next_upstream off;
        proxy_hide_header Cache-Control;
    }
    location = /v1/auth/web/email/code {
        if ($request_method != POST) { return 405; }
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header X-PlanPlan-Expected-User $http_x_planplan_expected_user;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_next_upstream off;
        proxy_hide_header Cache-Control;
    }
    location = /v1/auth/web/email/register {
        if ($request_method != POST) { return 405; }
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
